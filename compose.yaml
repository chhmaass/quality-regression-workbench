services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: workbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      SERVICE: api
      PORT: 8000
      WORKBENCH_API_KEY: ${WORKBENCH_API_KEY:?Set WORKBENCH_API_KEY in .env}
      DATABASE_URL: postgresql+psycopg://workbench:${POSTGRES_PASSWORD}@db:5432/workbench
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  ui:
    build: .
    environment:
      SERVICE: ui
      PORT: 8501
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
