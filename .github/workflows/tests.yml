name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U workbench" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pytest -q
      - run: python -m scripts.ui_smoke
      - run: python -m scripts.user_scenarios
      - name: PostgreSQL migration and round trip
        env:
          DATABASE_URL: postgresql+psycopg://workbench:test-only@localhost:5432/workbench
          WORKBENCH_API_KEY: test-ci-key
        run: |
          alembic upgrade head
          python -m scripts.postgres_smoke
